name: Fitty verification
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify version increase in every introduced commit
        run: npm run version:commits
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check
      - run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: System test (Chromium + WebKit)
        timeout-minutes: 3
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/fitness-http.log 2>&1 &
          BASE_URL=http://127.0.0.1:4173 npm run test:system
